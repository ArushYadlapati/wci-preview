name: Deploy WCI preview

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_REPO: WestCoastInvitational/WestCoastInvitational.org
  SOURCE_BRANCH: dev
  PREVIEW_URL: https://arushyadlapati.github.io/wci-preview

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.compare.outputs.sha }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare dev with the deployed commit
        id: compare
        run: |
          sha=$(git ls-remote "https://github.com/$SOURCE_REPO.git" "refs/heads/$SOURCE_BRANCH" | cut -f1)
          if [ -z "$sha" ]; then
            echo "Could not resolve $SOURCE_BRANCH on $SOURCE_REPO" >&2
            exit 1
          fi
          deployed=$(curl -fsS "$PREVIEW_URL/commit.txt?run=$GITHUB_RUN_ID" || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$sha" != "$deployed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Installing and building runs the project's code, so this job can't write to anything.
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the org repo's dev branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/site/package-lock.json

      - name: Install dependencies
        working-directory: source/site
        run: npm ci

      - name: Build the site
        working-directory: source/site
        env:
          BASE_PATH: /wci-preview
          PUBLIC_NOINDEX: "true"
        run: npm run build

      - name: Confirm the test copy stays out of search results
        working-directory: source/site
        run: |
          total=$(find dist -name index.html | xargs grep -L 'http-equiv="refresh"' | wc -l)
          marked=$(find dist -name index.html | xargs grep -l 'name="robots" content="noindex' | wc -l)
          echo "pages: $total, marked noindex: $marked"
          [ "$total" -gt 0 ] && [ "$marked" -ge "$total" ]

      - name: Record the deployed commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: echo "$SHA" > source/site/dist/commit.txt

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
